<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | AFIYA FASHION HOUSE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="assets/logo/logo.svg" alt="AFIYA logo" />
          <span class="brand-name">AFIYA FASHION HOUSE</span>
        </a>
      </div>
    </header>

    <main class="container section">
      <div class="section-header">
        <h2>Contact</h2>
        <p>Reach out for product support, order help, and brand collaborations.</p>
      </div>
      <div class="checkout-grid">
        <div class="form-panel">
          <form>
            <div class="input-grid">
              <div class="field"><label>Name</label><input type="text" /></div>
              <div class="field"><label>Phone</label><input type="tel" /></div>
            </div>
            <div class="input-grid">
              <div class="field"><label>Email</label><input type="email" /></div>
              <div class="field"><label>Business Name</label><input type="text" value="AFIYA FASHION HOUSE" /></div>
            </div>
            <div class="field"><label>Message</label><textarea></textarea></div>
            <button class="btn btn-primary" type="submit">Send Message</button>
          </form>
        </div>
        <div class="order-panel">
          <h3>Business Details</h3>
          <ul>
            <li><strong>Business Name:</strong> AFIYA FASHION HOUSE</li>
            <li><strong>Phone:</strong> 01701585007</li>
            <li><strong>WhatsApp:</strong> 01701585007</li>
            <li><strong>Email:</strong> hello@afiyafashionhouse.com</li>
            <li><strong>Address:</strong> Dhaka, Bangladesh</li>
          </ul>
        </div>
      </div>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
