<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product details from AFIYA FASHION HOUSE." />
    <title>Product Details | AFIYA FASHION HOUSE</title>
    <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />

  <body data-page="product">
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="assets/logo/logo.svg" alt="AFIYA FASHION HOUSE logo" />
          <span class="brand-name">AFIYA FASHION HOUSE</span>

        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>

        </div>
      </div>
    </header>

    <main class="container detail-shell">
      <div id="product-detail-root"></div>
