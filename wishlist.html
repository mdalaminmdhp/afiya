<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist | AFIYA FASHION HOUSE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="assets/logo/logo.svg" alt="AFIYA logo" />
          <span class="brand-name">AFIYA FASHION HOUSE</span>
        </a>
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Search products" data-search-input aria-label="Search products" />
        </div>
        <div class="header-actions">
          <a href="checkout.html" class="icon-btn"><i class="fa-solid fa-bag-shopping"></i><span class="count-badge" data-cart-count>0</span></a>
        </div>
      </div>
    </header>

    <main class="container section">
      <div class="section-header">
        <h2>Wishlist</h2>
        <p>Your saved favorite pieces.</p>
      </div>
      <div id="wishlist-items" class="products-grid"></div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/wishlist.js"></script>
  </body>
</html>
